name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            streamlit_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names)
        run: flake8 streamlit_app tests benchmark --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (style)
        run: flake8 streamlit_app tests benchmark --count --statistics

      - name: Run tests with coverage
        run: python -m pytest -q --cov=streamlit_app --cov-report=term-missing
