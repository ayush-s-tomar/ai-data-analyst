name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install bandit pip-audit
      - name: bandit (medium severity and above; sandbox.py exec/pickle findings are expected)
        run: bandit -r streamlit_app -ll
        continue-on-error: true
      - name: pip-audit (known vulnerable dependencies)
        run: pip-audit -r streamlit_app/requirements.txt
        continue-on-error: true
